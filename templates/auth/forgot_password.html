<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Password dimenticata · MyNutriApp</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="login-body">
    <main class="login-shell">
        <section class="login-container">
            <header class="login-brand">
                <div class="login-brand-copy">
                    <h1 class="login-title">Password dimenticata</h1>
                    <p class="login-subtitle">Area professionisti: inserisci l'email dell'account</p>
                </div>
            </header>

            {% with messages = get_flashed_messages(with_categories=true) %}
              {% if messages %}
              <div class="login-flashes" role="alert">
                {% for category, message in messages %}
                <div class="login-flash login-flash--{{ category }}">{{ message }}</div>
                {% endfor %}
              </div>
              {% endif %}
            {% endwith %}

            <form method="POST" class="login-form">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>
                <div class="login-field">
                    <label class="login-label" for="email">Email</label>
                    <input id="email" type="email" name="email" class="login-input" required autocomplete="email" placeholder="nome@studio.it">
                </div>
                <button type="submit" class="login-submit">Invia link di reset</button>
            </form>
            <p class="login-hint" style="margin-top:1rem;text-align:center;">
                <a href="{{ url_for('auth.login') }}">Torna al login</a>
            </p>
        </section>
    </main>
</body>
</html>
