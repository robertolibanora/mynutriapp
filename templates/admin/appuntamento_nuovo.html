{% extends 'base_admin.html' %}
{% block title %}Nuovo Appuntamento{% endblock %}
{% block content %}

<style>
  .admin-app .apn { width: 100%; }
  .admin-app .apn-hero {
    margin-bottom: 1.25rem;
    padding: 1.5rem 1.65rem;
    border-radius: 18px;
    background: linear-gradient(120deg, rgba(255,255,255,0.08), rgba(255,255,255,0.04) 70%, transparent);
    border: 1px solid rgba(255,255,255,0.12);
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    gap: 1rem;
    flex-wrap: wrap;
  }
  .admin-app .apn-hero h1 {
    margin: 0;
    color: #fff;
    font: 500 1.85rem / 1.2 var(--adm-serif, Georgia, serif);
  }
  .admin-app .apn-hero p {
    margin: 0.4rem 0 0;
    color: #a8a8a8;
    font-size: 0.9rem;
  }
  .admin-app .apn-card {
    width: 100%;
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 16px;
    padding: 1.5rem 1.65rem;
    box-sizing: border-box;
  }
  .admin-app .apn-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 1.1rem 1.35rem;
  }
  @media (max-width: 720px) {
    .admin-app .apn-grid { grid-template-columns: 1fr; }
  }
  .admin-app .apn-grid .apn-span-2 { grid-column: 1 / -1; }
  .admin-app .apn-card .form-group { margin: 0; }
  .admin-app .apn-card label {
    display: block;
    margin: 0 0 0.4rem;
    color: #a8a8a8;
    font-size: 0.75rem;
    font-weight: 650;
    letter-spacing: 0.06em;
    text-transform: uppercase;
  }
  .admin-app .apn-hint {
    margin: 0.4rem 0 0;
    color: #7a7a7a;
    font-size: 0.8rem;
  }
  .admin-app .apn-actions {
    display: flex;
    gap: 0.5rem;
    flex-wrap: wrap;
    margin-top: 1.35rem;
    padding-top: 1.15rem;
    border-top: 1px solid rgba(255,255,255,0.1);
  }
</style>

<div class="apn">
  <header class="apn-hero">
    <div>
      <h1>Nuovo appuntamento</h1>
      <p>Pianifica un incontro con un paziente.</p>
    </div>
    <a href="{{ url_for('agenda.agenda_unificata') }}" class="btn btn-ghost btn-small">{{ icon('calendar', 14) }} Agenda</a>
  </header>

  <form method="POST" class="apn-card">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>

    <div class="apn-grid">
      <div class="form-group">
        <label for="patient_id">Paziente *</label>
        <select name="patient_id" id="patient_id" class="input-text input-select" required>
          <option value="">Scegli un paziente…</option>
          {% for p in pazienti %}
          <option value="{{ p.id }}">{{ p.nome }} {{ p.cognome }} — {{ p.telefono }}</option>
          {% endfor %}
        </select>
      </div>

      <div class="form-group">
        <label for="data_appuntamento">Data e ora *</label>
        <input type="datetime-local" id="data_appuntamento" name="data_appuntamento" class="input-text" required>
      </div>

      <div class="form-group">
        <label for="tipo">Tipo *</label>
        <select name="tipo" id="tipo" class="input-text input-select" required>
          <option value="">Seleziona tipo…</option>
          <option value="allenamento_1to1">Allenamento 1-to-1</option>
          <option value="rinnovo_dieta">Rinnovo dieta</option>
          <option value="rinnovo_allenamento">Rinnovo allenamento</option>
          <option value="check">Check</option>
          <option value="altro">Altro</option>
        </select>
        <p class="apn-hint">Tipologia dell’appuntamento</p>
      </div>

      <div class="form-group">
        <label for="note">Note</label>
        <textarea id="note" name="note" class="input-text" rows="3" placeholder="Es. Portare esami del sangue recenti"></textarea>
        <p class="apn-hint">Opzionale</p>
      </div>
    </div>

    <div class="apn-actions">
      <button type="submit" class="btn btn-ghost btn-small">{{ icon('save', 14) }} Crea appuntamento</button>
      <a href="{{ url_for('agenda.agenda_unificata') }}" class="btn btn-ghost btn-small">{{ icon('undo', 14) }} Annulla</a>
    </div>
  </form>
</div>

{% endblock %}
