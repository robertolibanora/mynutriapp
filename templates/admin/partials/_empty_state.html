{# Expects: title, optional description, optional action_url, action_label #}
<div class="adm-empty">
  <div class="adm-empty-title">{{ title }}</div>
  {% if description %}
  <p class="adm-empty-desc">{{ description }}</p>
  {% endif %}
  {% if action_url and action_label %}
  <a href="{{ action_url }}" class="btn btn-primary btn-small">{{ action_label }}</a>
  {% endif %}
</div>
