<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">

    <link rel="icon" type="image/png" sizes="32x32" href="{{ url_for('static', filename='icons/favicon-32.png') }}">
    <link rel="icon" type="image/png" sizes="48x48" href="{{ url_for('static', filename='icons/favicon-48.png') }}">
    <link rel="apple-touch-icon" href="{{ url_for('static', filename='icons/apple-touch-icon.png') }}">
    <meta name="theme-color" content="#0f0f0f">
    <meta name="application-name" content="MyNutriApp">

    <title>Accedi · MyNutriApp</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="login-body">
    <main class="login-shell">
        <section class="login-container" aria-labelledby="login-heading">
            <header class="login-brand">
                <div class="login-mark" aria-hidden="true">
                    <img
                        src="{{ url_for('static', filename='img/logo-small.png') }}"
                        alt=""
                        width="96"
                        height="96"
                        decoding="async"
                    >
                </div>
                <div class="login-brand-copy">
                    <h1 id="login-heading" class="login-title">MyNutriApp</h1>
                    <p class="login-subtitle">Nutrizione e benessere, in un unico spazio</p>
                </div>
            </header>

            {% with messages = get_flashed_messages(with_categories=true) %}
              {% if messages %}
              <div class="login-flashes" role="alert">
                {% for category, message in messages %}
                <div class="login-flash login-flash--{{ category }}">{{ message }}</div>
                {% endfor %}
              </div>
              {% endif %}
            {% endwith %}

            <form method="POST" class="login-form">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>

                <div class="login-field">
                    <label class="login-label" for="telefono">Telefono</label>
                    <input id="telefono" type="tel" name="telefono" class="login-input" placeholder="3401234567" autocomplete="tel" inputmode="tel" required>
                </div>

                <div class="login-field">
                    <label class="login-label" for="email">Email <span class="login-optional">(se richiesta)</span></label>
                    <input id="email" type="email" name="email" class="login-input" placeholder="nome@email.it" autocomplete="email">
                </div>

                <div class="login-field">
                    <label class="login-label" for="password">Password</label>
                    <input id="password" type="password" name="password" class="login-input" autocomplete="current-password" required>
                </div>

                <p class="login-hint" style="text-align:right;margin:-0.25rem 0 0.75rem;">
                    <a href="{{ url_for('auth.forgot_password') }}">Password dimenticata?</a>
                </p>

                <button type="submit" class="login-submit">Accedi</button>
            </form>
        </section>
    </main>
</body>
</html>
